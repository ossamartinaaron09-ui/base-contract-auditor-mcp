name: 'Base & EVM Smart Contract Security Auditor'
description: 'Automated CI/CD security audit for Base and EVM smart contracts, detecting delegatecall risks, reentrancy vulnerabilities, and selfdestruct opcodes.'
author: 'ossamartinaaron09-ui'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  contract_address:
    description: 'Optional deployed contract address on Base to inspect on-chain'
    required: false
    default: ''
  fail_on_critical:
    description: 'Fail the workflow if CRITICAL or HIGH risk is detected'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run Base Contract Security Audit
      shell: bash
      env:
        INPUT_CONTRACT_ADDRESS: ${{ inputs.contract_address }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
      run: |
        python3 "${{ github.action_path }}/action_scanner.py"
